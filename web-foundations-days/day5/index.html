<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="QuickNotes — fetch users from an API, filter by name."
    />
    <title>QuickNotes — Users</title>
    <link rel="stylesheet" href="../style.css" />
    <script src="users.js" defer></script>
  </head>
  <body>
    <header class="site-header">
      <div class="header-inner">
        <div>
          <h1>QuickNotes</h1>
          <p class="tagline">Fetch, filter, and browse users.</p>
        </div>
      </div>
    </header>

    <main>
      <section class="card" aria-labelledby="users-heading">
        <h2 id="users-heading">Users</h2>

        <div class="users-controls">
          <button id="load-users" type="button" class="btn btn-primary">
            Load users
          </button>

          <div class="form-field">
            <label for="filter-input">Filter by name</label>
            <input
              id="filter-input"
              type="search"
              placeholder="Type a name…"
              autocomplete="off"
              aria-describedby="status"
            />
          </div>
        </div>

        <p id="status" role="status" aria-live="polite"></p>

        <ul id="users-list" class="users-list"></ul>
      </section>
    </main>

    <footer class="site-footer">
      <p>&copy; 2026 QuickNotes. All rights reserved.</p>
    </footer>
  </body>
</html>
