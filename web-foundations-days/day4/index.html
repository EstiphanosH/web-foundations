<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QuickNotes - Note Editor</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <header>
      <h1>QuickNotes</h1>
      <p>Fast, simple note-taking for everyone.</p>
      <nav>
        <a href="index.html" class="active">Home</a>
        <a href="about.html">About</a>
      </nav>
    </header>

    <main>
      <section>
        <h2>New Note</h2>

        <label for="note-text">Your note</label>
        <textarea
          id="note-text"
          rows="8"
          placeholder="Start typing your note… (max 200 characters)"
        ></textarea>

        <p id="char-count" aria-live="polite">0 / 200 characters</p>
        <p id="word-count" aria-live="polite">0 words</p>

        <div class="button-row">
          <button id="clear-btn" type="button">Clear</button>
          <button id="theme-toggle" type="button">Dark mode</button>
        </div>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 QuickNotes. All rights reserved.</p>
    </footer>
  </body>
</html>
